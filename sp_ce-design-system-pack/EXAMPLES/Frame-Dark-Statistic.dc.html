<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="../../_ds/sp-ce-design-system-e2dc936f-2579-4a01-b55f-8d161ea0bb60/colors_and_type.css">
<script src="../../_ds/sp-ce-design-system-e2dc936f-2579-4a01-b55f-8d161ea0bb60/_ds_bundle.js"></script>
<style>
@font-face { font-family: "Inter"; src: url("../ASSETS/fonts/Inter-VariableFont_slnt_wght.ttf") format("truetype"); font-weight: 100 900; }
@font-face { font-family: "JetBrains Mono"; src: url("../ASSETS/fonts/JetBrainsMono-VariableFont_wght.ttf") format("truetype"); font-weight: 100 800; }
body { margin: 0; }
a { color: #AABCFF; } a:hover { color: #E4E8EF; }
</style>
</helmet>
<div data-screen-label="Dark statistic frame" style="position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #1C1F2A; font-family: 'Inter', sans-serif; font-feature-settings: 'ss01' 1, 'cv11' 1; -webkit-font-smoothing: antialiased;">
  <canvas ref="{{ canvasRef }}" width="1080" height="760" style="position: absolute; left: 0; top: 0; width: 1080px; height: 760px;"></canvas>
  <img src="../ASSETS/logos/logo-mark-small.png" alt="sp_ce" style="position: absolute; left: 58px; top: 52px; width: 204px; height: auto; display: block;">
  <div style="position: absolute; right: 72px; top: 72px; font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 22px; line-height: 1; letter-spacing: 0.04em; color: #8B95A7; font-variant-numeric: tabular-nums;">01 / 04</div>
  <div style="position: absolute; left: 72px; right: 72px; bottom: 72px; display: flex; flex-direction: column;">
    <div style="font-weight: 500; font-size: 24px; line-height: 1.2; letter-spacing: 0.12em; text-transform: uppercase; color: #AABCFF;">[Section label]</div>
    <div style="width: 96px; height: 8px; margin: 24px 0 40px; background: linear-gradient(135deg, #AABCFF 0%, #E0ADF9 100%);"></div>
    <div style="font-weight: 600; font-size: 220px; line-height: 0.95; letter-spacing: -0.02em; color: #FFFFFF; font-variant-numeric: tabular-nums;">00.0%</div>
    <div style="margin-top: 28px; max-width: 820px; font-weight: 500; font-size: 36px; line-height: 1.3; letter-spacing: -0.01em; color: #E4E8EF; text-wrap: pretty;">[Statistic label: what the figure measures, in one or two lines]</div>
    <div style="margin-top: 20px; max-width: 820px; font-weight: 400; font-size: 32px; line-height: 1.4; color: #8B95A7; text-wrap: pretty;">[One approved supporting sentence.]</div>
    <div style="margin-top: 64px; display: flex; flex-direction: column; gap: 4px; font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 22px; line-height: 1.45; color: #8B95A7;">
      <div>Source: [Approved source] · Period: [Start–End]</div>
    </div>
  </div>
  <sc-if value="{{ guides }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; pointer-events: none; font-family: 'JetBrains Mono', monospace; font-size: 18px; color: #E0ADF9;">
      <div style="position: absolute; left: 72px; top: 72px; right: 72px; bottom: 72px; border: 2px dashed #E0ADF9;"></div>
      <div style="position: absolute; left: 34px; top: 0; bottom: 0; border-left: 1px solid rgba(224,173,249,0.5);"></div>
      <div style="position: absolute; left: 1046px; top: 0; bottom: 0; border-left: 1px solid rgba(224,173,249,0.5);"></div>
      <div style="position: absolute; left: 80px; top: 80px; padding: 4px 8px; background: #000000;">content-safe 72px inset</div>
      <div style="position: absolute; left: 0; right: 0; top: 720px; border-top: 1px dashed rgba(224,173,249,0.5);"></div>
      <div style="position: absolute; right: 80px; top: 690px; padding: 4px 8px; background: #000000;">particle fade ends y 720</div>
      <div style="position: absolute; left: 42px; bottom: 20px; padding: 4px 8px; background: #000000;">3:4 grid crop x 34–1046</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1350},&quot;guides&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  canvasRef = React.createRef();
  componentDidMount() { this.draw(); }
  componentDidUpdate() { this.draw(); }
  draw() {
    const c = this.canvasRef.current; if (!c) return;
    const ctx = c.getContext('2d'); const W = 1080, H = 760;
    ctx.clearRect(0, 0, W, H);
    const heat = ['#2A3878', '#4A5FB8', '#7A92E8', '#AABCFF', '#C7D2FF', '#EEF2FF'];
    const step = 16;
    for (let y = step / 2; y < H; y += step) {
      for (let x = step / 2; x < W; x += step) {
        const nx = x / W, ny = y / H;
        const dx = (x - 720) / 420, dy = (y - 360) / 230;
        const core = Math.exp(-(dx * dx + dy * dy) * 1.1);
        const tex = 0.14 * Math.sin(nx * 9.3 + ny * 4.1) + 0.1 * Math.cos(nx * 5.7 - ny * 11.2 + 0.8);
        let v = core * (0.95 + tex);
        const top = Math.min(1, Math.max(0, (y - 150) / 110));
        const fade = top * Math.min(1, Math.max(0, (720 - y) / 180));
        const a = Math.max(0, Math.min(1, v)) * fade;
        if (a < 0.06) continue;
        const idx = Math.min(5, Math.floor(a * 6.2));
        ctx.globalAlpha = Math.min(0.85, 0.25 + a * 0.75);
        ctx.fillStyle = heat[idx];
        ctx.beginPath(); ctx.arc(x, y, 1 + a * 2.6, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
  renderVals() {
    return { canvasRef: this.canvasRef, guides: !!this.props.guides };
  }
}
</script>
</body>
</html>
