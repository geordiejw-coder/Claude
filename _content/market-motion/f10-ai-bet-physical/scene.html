<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<title>F10 Abu Dhabi AI Bet</title>
<!--
  F10 — Abu Dhabi's AI bet is physical. sp_ce market-motion film, 30 s, 1080 × 1920.
  One scene. renderAt(t) is a pure function of film time t (seconds): every particle position, every
  text state and the camera are computed from t and the seeded constants below, never from frame history.
  Brand and layout follow _content/market-motion/MARKET-MOTION-PRODUCTION-SPEC.md.
-->
<style>
  @font-face { font-family: "Inter"; src: url("assets/Inter-VariableFont_slnt_wght.ttf") format("truetype"); font-weight: 100 900; }
  :root {
    /* design-tokens.json: sp-black, text-on-dark-1/2/3 (white, Cloud, Mist), sp-ice-blue */
    --black: #000000; --ink: #FFFFFF; --cloud: #E4E8EF; --mist: #8B95A7; --ice: #AABCFF;
  }
  html, body { margin: 0; padding: 0; background: var(--black); }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--black);
           font-family: "Inter"; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage canvas, .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #vignette { background: radial-gradient(140% 90% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.85) 100%); }
  #grain { mix-blend-mode: overlay; opacity: 0.055; }
  #logo { position: absolute; }
  #text { position: absolute; inset: 0; }
  .block { position: absolute; left: 96px; }
  .mask { overflow: hidden; padding-bottom: 0.14em; margin-bottom: -0.14em; }
  .mask > div { will-change: transform; }
  .title { font-size: 84px; letter-spacing: -0.03em; line-height: 1.02; white-space: nowrap; }
  .t800 { font-weight: 800; } .t600 { font-weight: 600; }
  .hero { font-size: 224px; font-weight: 700; line-height: 1; letter-spacing: -0.035em; color: var(--ice);
          white-space: nowrap; }  /* a single figure: proportional '1' so 1GW reads as one word */
  .hero .unit { font-size: 0.62em; font-weight: 600; letter-spacing: -0.02em; margin-left: 0.04em; }
  .label { font-size: 46px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); white-space: nowrap; }
  .support { font-size: 34px; font-weight: 600; color: var(--cloud); white-space: nowrap; }
  .source { font-size: 22px; font-weight: 400; color: var(--mist); line-height: 1.4; white-space: nowrap; }
  .ink { display: inline-block; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="vignette" class="layer"></div>
  <img id="logo" src="assets/sp_ce-logo.svg" alt="">
  <div id="text">
    <!-- 0–6 s -->
    <div class="block" id="title" style="top:574px">
      <div class="mask"><div><span class="ink title t800" data-copy>Abu Dhabi's AI bet</span></div></div>
      <div class="mask" style="margin-top:10px"><div><span class="ink title t600" data-copy>is physical.</span></div></div>
    </div>
    <!-- 6–14 s: hero 520 / label 778 / supporting 840 (spec §1) -->
    <div class="block" id="fig" style="top:520px"><span class="ink hero" data-copy>1<span class="unit">GW</span></span></div>
    <div class="block" id="lab" style="top:778px"><div class="mask"><div><span class="ink label" data-copy>Stargate UAE cluster announced</span></div></div></div>
    <div class="block" id="sup" style="top:840px"><div class="mask"><div><span class="ink support" data-copy>Abu Dhabi · Announced May 2025</span></div></div></div>
    <!-- 14–23 s -->
    <div class="block" id="compute" style="top:574px">
      <div class="mask"><div><span class="ink title t800" data-copy>Compute needs</span></div></div>
      <div class="mask" style="margin-top:10px"><div><span class="ink title t600" data-copy>infrastructure.</span></div></div>
    </div>
    <!-- 23–30 s -->
    <div class="block" id="final" style="top:574px">
      <div class="mask"><div><span class="ink title t800" data-copy>Read the city's</span></div></div>
      <div class="mask" style="margin-top:10px"><div><span class="ink title t600" data-copy>next economy.</span></div></div>
    </div>
    <!-- source: bottom at y 1558 (spec §1) -->
    <div class="block" id="src" style="top:1558px; transform: translateY(-100%)"><span class="ink source" data-copy>OpenAI · Introducing Stargate UAE · 22 May 2025</span></div>
  </div>
  <canvas id="grain" width="1080" height="1920"></canvas>
</div>

<script>
'use strict';
// ------------------------------------------------------------------ constants
const W = 1080, H = 1920, FPS = 30, DURATION = 30;
const FOCAL = 1020;                 // spec §6: f = 1020 px
const PP = {x: 540, y: 1060};       // principal point, 0.552 H
const ICE = [170, 188, 255];

// ------------------------------------------------------------------ easing / helpers
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const smooth = x => x * x * (3 - 2 * x);
const inOutCubic = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const outExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const lerp = (a, b, k) => a + (b - a) * k;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(r) { let u = 0, v = 0; while (u === 0) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

// ------------------------------------------------------------------ timeline (film seconds)
// Every readable text state holds ≥ 2.5 s (spec §4). Figure appears whole; labels mask in with outExpo.
const T = {
  logoIn: [0.15, 0.9],
  title: {in: [0.45, 0.65], len: 0.6, out: [5.35, 5.45], outLen: 0.55},     // readable 1.25 → 5.35
  build: {start: 1.15, spread: 3.3, durMin: 0.95, durMax: 1.45},              // lattice resolved by ≈ 5.95
  sup:   {in: 6.15, out: 13.5},    // May 2025 label first, into the opening
  lab:   {in: 6.45, out: 13.4},
  fig:   {in: [7.25, 7.65], out: [13.35, 13.85]},                              // readable 7.65 → 13.35
  src:   {in: [6.15, 6.6], out: [14.0, 14.5]},                                 // through the figure and its exit
  connect: {start: 14.0, spread: 2.4, dur: 1.2},
  compute: {in: [14.55, 14.75], len: 0.6, out: [22.35, 22.45], outLen: 0.55}, // readable 15.35 → 22.35
  final: {in: [23.0, 23.2], len: 0.6},                                         // fully on 23.8, holds to 30
};
// Hold windows for the world time-map (spec §4: world slows to ≈0.4× with 0.35 s smoothstep ramps).
const HOLDS = [[1.6, 5.3], [7.8, 13.3], [15.4, 22.3], [23.9, 30.5]];
const HOLD_SPEED = 0.4, RAMP = 0.35;
function speedAt(t) {
  let s = 1;
  for (const [a, b] of HOLDS) {
    const k = smooth(seg(t, a - RAMP, a)) * (1 - smooth(seg(t, b, b + RAMP)));
    s = Math.min(s, 1 - (1 - HOLD_SPEED) * k);
  }
  return s;
}
const WT_STEP = 1 / 240, WT = new Float64Array(Math.ceil(31 / WT_STEP) + 2);
for (let i = 1; i < WT.length; i++) WT[i] = WT[i - 1] + speedAt((i - 0.5) * WT_STEP) * WT_STEP;
function worldTime(t) { const x = Math.max(0, t) / WT_STEP, i = Math.min(WT.length - 2, Math.floor(x)); return lerp(WT[i], WT[i + 1], x - i); }

// ------------------------------------------------------------------ camera: one slow continuous move
// Quadratic Bézier for position (continuous velocity, never stops, gathers pace into the last hold so the
// depth of the structure reads), a slowly drifting look-at target, breathing ±0.012 units, roll ≤ 0.6°.
const CAM = {
  p0: [-0.5, -0.35, -3.0], p1: [0.5, 0.05, 0.6], p2: [5.2, 1.25, 3.4],
  t0: [0.0, 0.55, 20.0],   t1: [-1.6, 0.75, 19.0],
};
function camera(t) {
  const u = clamp01(t / DURATION), a = (1 - u) * (1 - u), b = 2 * u * (1 - u), c = u * u;
  const p = [0, 1, 2].map(i => a * CAM.p0[i] + b * CAM.p1[i] + c * CAM.p2[i]);
  p[0] += 0.012 * Math.sin(t * 0.83); p[1] += 0.012 * Math.sin(t * 0.61 + 1.3);
  const tg = [0, 1, 2].map(i => lerp(CAM.t0[i], CAM.t1[i], smooth(u)));
  let f = [tg[0] - p[0], tg[1] - p[1], tg[2] - p[2]];
  const fl = Math.hypot(...f); f = f.map(v => v / fl);
  // right = up × f, up' = f × right
  let r = [f[2], 0, -f[0]]; const rl = Math.hypot(...r); r = r.map(v => v / rl);
  let up = [f[1] * r[2] - f[2] * r[1], f[2] * r[0] - f[0] * r[2], f[0] * r[1] - f[1] * r[0]];
  const roll = (0.6 * Math.PI / 180) * Math.sin(u * Math.PI * 1.3);
  const cr = Math.cos(roll), sr = Math.sin(roll);
  const r2 = r.map((v, i) => cr * v + sr * up[i]), u2 = up.map((v, i) => cr * v - sr * r[i]);
  return {p, r: r2, u: u2, f, yaw: Math.atan2(f[0], f[2]), roll};
}

// ------------------------------------------------------------------ the structure
// A 3D lattice of nodes (spacing S) with a frustum-shaped opening: every lattice point whose projection, from the
// camera pose at t = 8 s, falls inside the type block is left out. The opening is a real cavity in the structure,
// so when the camera moves at the end its walls read as depth.
const S = 2.4;
// Lattice in its own frame, turned against the view (yaw 31°, tilt 13°) so it reads as a built 3D structure
// with three vanishing directions rather than a tunnel.
const GRID = {i: [-7, 7], j: [-10, 14], k: [-3, 3]};
const LAT = {c: [0.4, 1.2, 19.5], yaw: 31 * Math.PI / 180, tilt: 13 * Math.PI / 180};
function latticeToWorld(i, j, k) {
  const x = i * S, y = j * S, z = k * S;
  const ct = Math.cos(LAT.tilt), st = Math.sin(LAT.tilt);
  const y1 = y * ct - z * st, z1 = y * st + z * ct;            // tilt about x
  const cy = Math.cos(LAT.yaw), sy = Math.sin(LAT.yaw);
  const x2 = x * cy + z1 * sy, z2 = -x * sy + z1 * cy;          // turn about y
  return [LAT.c[0] + x2, LAT.c[1] + y1, LAT.c[2] + z2];
}
const OPENING = {x0: 50, x1: 1030, y0: 430, y1: 948};   // screen px, around the type block (468–900 + margins)
const REF = camera(8.0);
function projectWith(cam, x, y, z, out) {
  const dx = x - cam.p[0], dy = y - cam.p[1], dz = z - cam.p[2];
  const zc = dx * cam.f[0] + dy * cam.f[1] + dz * cam.f[2];
  const xc = dx * cam.r[0] + dy * cam.r[1] + dz * cam.r[2];
  const yc = dx * cam.u[0] + dy * cam.u[1] + dz * cam.u[2];
  out[0] = PP.x + FOCAL * xc / zc; out[1] = PP.y - FOCAL * yc / zc; out[2] = zc;
  return out;
}
const _tmp = [0, 0, 0];
function inOpening(x, y, z) {
  projectWith(REF, x, y, z, _tmp);
  return _tmp[2] > 0 && _tmp[0] > OPENING.x0 && _tmp[0] < OPENING.x1 && _tmp[1] > OPENING.y0 && _tmp[1] < OPENING.y1;
}

const rand = mulberry32(0xF10A1);   // seeded once; particle identities never change
const nodes = [];                   // {x,y,z}
const nodeIndex = new Map();
for (let k = GRID.k[0]; k <= GRID.k[1]; k++)
  for (let j = GRID.j[0]; j <= GRID.j[1]; j++)
    for (let i = GRID.i[0]; i <= GRID.i[1]; i++) {
      const [x, y, z] = latticeToWorld(i, j, k);
      if (inOpening(x, y, z)) continue;
      nodeIndex.set(i + ',' + j + ',' + k, nodes.length);
      nodes.push({x, y, z, i, j, k});
    }
const edges = [];
for (const n of nodes) {
  for (const [di, dj, dk] of [[1, 0, 0], [0, 1, 0], [0, 0, 1]]) {
    const m = nodeIndex.get((n.i + di) + ',' + (n.j + dj) + ',' + (n.k + dk));
    if (m === undefined) continue;
    const b = nodes[m];
    if (inOpening((n.x + b.x) / 2, (n.y + b.y) / 2, (n.z + b.z) / 2)) continue;
    edges.push([nodeIndex.get(n.i + ',' + n.j + ',' + n.k), m]);
  }
}
const PER_EDGE = 18, EDGE_FRACS = Array.from({length: PER_EDGE}, (_, e) => (e + 1) / (PER_EDGE + 1));
const NN = nodes.length, NE = edges.length * PER_EDGE, N = NN + NE;

// Per-particle seeded state (Float32Array per field).
const P = {
  // settled position before connections (node, or a tight cluster at the edge's first node)
  ax: new Float32Array(N), ay: new Float32Array(N), az: new Float32Array(N),
  // position once the connection is readable (edge point); nodes: same as a*
  bx: new Float32Array(N), by: new Float32Array(N), bz: new Float32Array(N),
  // cloud origin and drift phases
  cx: new Float32Array(N), cy: new Float32Array(N), cz: new Float32Array(N), ph: new Float32Array(N),
  t0: new Float32Array(N), dur: new Float32Array(N), lift: new Float32Array(N),
  tc: new Float32Array(N), bright: new Float32Array(N), kind: new Uint8Array(N),
};
let yMin = 1e9, yMax = -1e9, zMin = 1e9, zMax = -1e9;
for (const q of nodes) { yMin = Math.min(yMin, q.y); yMax = Math.max(yMax, q.y); zMin = Math.min(zMin, q.z); zMax = Math.max(zMax, q.z); }
const CLOUD = [0.0, -5.6, 17.0];
function seedParticle(p, kind, a, b, nodeRef) {
  P.kind[p] = kind;
  P.ax[p] = a[0]; P.ay[p] = a[1]; P.az[p] = a[2];
  P.bx[p] = b[0]; P.by[p] = b[1]; P.bz[p] = b[2];
  // Dense cloud below eye level: a compressed copy of the structure plus noise, so each point's path
  // opens outward and upward into place rather than criss-crossing.
  P.cx[p] = CLOUD[0] + nodeRef.x * 0.16 + gauss(rand) * 0.95;
  P.cy[p] = CLOUD[1] + (nodeRef.y - (yMin + yMax) / 2) * 0.07 + gauss(rand) * 0.75;
  P.cz[p] = CLOUD[2] + (nodeRef.z - (zMin + zMax) / 2) * 0.18 + gauss(rand) * 1.0;
  P.ph[p] = rand() * Math.PI * 2;
  // build order: bottom of the structure first, rising; small random spread
  const order = clamp01(0.82 * (nodeRef.y - yMin) / (yMax - yMin) + 0.18 * rand());
  P.t0[p] = T.build.start + order * T.build.spread + (kind ? rand() * 0.18 : 0);
  P.dur[p] = lerp(T.build.durMin, T.build.durMax, rand());
  P.lift[p] = 0.8 + rand() * 1.6;
  // connections become readable front to back
  P.tc[p] = T.connect.start + ((nodeRef.z - zMin) / (zMax - zMin)) * T.connect.spread + rand() * 0.25;
  P.bright[p] = 0.35 + 0.65 * Math.pow(rand(), 1.8);   // spec §5: 0.35–1, skewed low
}
for (let n = 0; n < NN; n++) { const q = nodes[n]; seedParticle(n, 0, [q.x, q.y, q.z], [q.x, q.y, q.z], q); }
{
  let p = NN;
  for (const [ia, ib] of edges) {
    const A = nodes[ia], B = nodes[ib];
    for (let e = 0; e < PER_EDGE; e++, p++) {
      const fr = EDGE_FRACS[e];
      const jx = gauss(rand) * 0.07, jy = gauss(rand) * 0.07, jz = gauss(rand) * 0.07;
      seedParticle(p, 1,
        [A.x + jx, A.y + jy, A.z + jz],
        [lerp(A.x, B.x, fr) + jx * 0.12, lerp(A.y, B.y, fr) + jy * 0.12, lerp(A.z, B.z, fr) + jz * 0.12], A);
    }
  }
}

// ------------------------------------------------------------------ particle position (pure in t)
function bez(p0, p1, p2, p3, u) { const v = 1 - u; return v * v * v * p0 + 3 * v * v * u * p1 + 3 * v * u * u * p2 + u * u * u * p3; }
const POS = [0, 0, 0];
// returns arrival progress state in POS[3]-like fields via globals for speed
let _landAge = 0, _align = 0, _arrive = 0;
function particleAt(p, t, wt) {
  const ph = P.ph[p];
  // cloud: slow non-rotational drift on world time (no vortex)
  const cx = P.cx[p] + 0.32 * Math.sin(wt * 0.31 + ph) + 0.10 * wt;
  const cy = P.cy[p] + 0.26 * Math.sin(wt * 0.27 + ph * 1.7) + 0.06 * wt;
  const cz = P.cz[p] + 0.30 * Math.sin(wt * 0.23 + ph * 2.3);
  // settled target: before → after connection alignment
  const al = inOutCubic(seg(t, P.tc[p], P.tc[p] + T.connect.dur));
  _align = P.kind[p] ? al : 0;
  const breathe = 0.018;
  const tx = lerp(P.ax[p], P.bx[p], _align) + breathe * Math.sin(wt * 0.9 + ph);
  const ty = lerp(P.ay[p], P.by[p], _align) + breathe * Math.sin(wt * 0.77 + ph * 1.3);
  const tz = lerp(P.az[p], P.bz[p], _align);
  const u = seg(t, P.t0[p], P.t0[p] + P.dur[p]);
  _arrive = u;
  _landAge = t - (P.t0[p] + P.dur[p]);
  if (u <= 0) { POS[0] = cx; POS[1] = cy; POS[2] = cz; return; }
  if (u >= 1) { POS[0] = tx; POS[1] = ty; POS[2] = tz; return; }
  const e = inOutCubic(u), L = P.lift[p];
  POS[0] = bez(cx, cx, tx, tx, e);
  POS[1] = bez(cy, cy + L, ty - L * 1.3, ty, e);
  POS[2] = bez(cz, cz, tz - 0.6, tz, e);
}

// ------------------------------------------------------------------ text layer
const $ = id => document.getElementById(id);
function setMask(el, inP, outP) {   // masked slide-up line (spec §4: 0.6 s outExpo in, 0.55 s inOutCubic out)
  const a = outExpo(clamp01(inP)), b = inOutCubic(clamp01(outP || 0));
  const inner = el.firstElementChild;
  const ty = (1 - a) * 105 - b * 105;
  inner.style.transform = `translateY(${ty.toFixed(3)}%)`;
  inner.style.opacity = (Math.min(1, a * 1.4) * (1 - b)).toFixed(4);
  return Math.min(1, a * 1.4) * (1 - b);
}
function twoLine(id, spec, t) {
  const m = $(id).querySelectorAll('.mask');
  let v = 0;
  for (let i = 0; i < 2; i++) {
    const vin = seg(t, spec.in[i], spec.in[i] + spec.len);
    const vout = spec.out ? seg(t, spec.out[i], spec.out[i] + spec.outLen) : 0;
    v = Math.max(v, setMask(m[i], vin, vout));
  }
  $(id).style.visibility = v > 0 ? 'visible' : 'hidden';
  return v;
}
function oneLine(id, tin, tout, t) {
  const v = setMask($(id).querySelector('.mask'), seg(t, tin, tin + 0.6), seg(t, tout, tout + 0.55));
  $(id).style.visibility = v > 0 ? 'visible' : 'hidden';
  return v;
}
// Logo: official SVG, ink width 113 px, ink top-left at (96, 226) (spec §1). Glyph extents from brand.ts.
const LOGO = {viewW: 342, viewH: 144, inkL: 24.0, inkR: 317.58, xTop: 40.43};
{
  const u = 113 / (LOGO.inkR - LOGO.inkL), el = $('logo');
  el.style.width = (LOGO.viewW * u) + 'px'; el.style.height = (LOGO.viewH * u) + 'px';
  el.style.left = (96 - LOGO.inkL * u) + 'px'; el.style.top = (226 - LOGO.xTop * u) + 'px';
}

// ------------------------------------------------------------------ drawing
const fx = $('fx'), ctx = fx.getContext('2d');
const bloom = document.createElement('canvas'); bloom.width = W / 4; bloom.height = H / 4;
const bctx = bloom.getContext('2d');
const layer = document.createElement('canvas'); layer.width = W; layer.height = H;
const lctx = layer.getContext('2d');
const A_LEVELS = [0.035, 0.07, 0.12, 0.19, 0.28, 0.40, 0.58, 0.85];
const S_LEVELS = [0.9, 1.25, 1.7, 2.3, 3.1, 4.2];
const paths = new Array(A_LEVELS.length * S_LEVELS.length);
function nearestIdx(levels, v) { let bi = 0, bd = 1e9; for (let i = 0; i < levels.length; i++) { const d = Math.abs(levels[i] - v); if (d < bd) { bd = d; bi = i; } } return bi; }
// grain: 4 seeded tiles (spec §6)
const grainTiles = [];
{
  const g = mulberry32(0x6A1);
  for (let n = 0; n < 4; n++) {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const x = c.getContext('2d'), img = x.createImageData(256, 256);
    for (let i = 0; i < img.data.length; i += 4) { const v = Math.floor(g() * 255); img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
    x.putImageData(img, 0, 0); grainTiles.push(c);
  }
}
const gctx = $('grain').getContext('2d');

// Text keep-out: no particle runs through letters. Each visible text block clears a padded rectangle.
const KEEP_PAD = 22, KEEP_FADE = 110;
function keepOut(rects, x, y) {
  let m = 1;
  for (let i = 0; i < rects.length; i++) {
    const r = rects[i];
    const dx = Math.max(r.x0 - x, 0, x - r.x1), dy = Math.max(r.y0 - y, 0, y - r.y1);
    const d = Math.hypot(dx, dy);
    const k = 1 - r.v * (1 - smooth(clamp01((d - KEEP_PAD) / KEEP_FADE)));
    if (k < m) m = k;
  }
  return m;
}

const SHUTTER = 0.55 / FPS;  // spec §6: 0.55-frame streaks, scaled by the time-map speed
const stats = {};
window.renderAt = function renderAt(t) {
  t = Math.max(0, Math.min(DURATION, t));
  const wt = worldTime(t), speed = speedAt(t);
  const cam = camera(t);
  const camPrev = camera(t - SHUTTER * speed);
  const wtPrev = worldTime(t - SHUTTER * speed);

  // ---------------- text
  $('logo').style.opacity = smooth(seg(t, ...T.logoIn)).toFixed(4);
  const vis = {};
  vis.title = twoLine('title', T.title, t);
  vis.sup = oneLine('sup', T.sup.in, T.sup.out, t);
  vis.lab = oneLine('lab', T.lab.in, T.lab.out, t);
  {
    const e = inOutCubic(seg(t, ...T.fig.in)), o = e * (1 - inOutCubic(seg(t, ...T.fig.out)));
    const el = $('fig');
    el.style.opacity = o.toFixed(4); el.style.transform = `translateY(${(16 * (1 - e)).toFixed(2)}px)`;
    el.style.visibility = o > 0 ? 'visible' : 'hidden';
    vis.fig = o;
  }
  {
    const o = smooth(seg(t, ...T.src.in)) * (1 - smooth(seg(t, ...T.src.out)));
    $('src').style.opacity = o.toFixed(4); $('src').style.visibility = o > 0 ? 'visible' : 'hidden';
    vis.src = o;
  }
  vis.compute = twoLine('compute', T.compute, t);
  vis.final = twoLine('final', T.final, t);
  // text parallax with the camera (spec §6, ≤ 34 px; held to ≤ 10 px here)
  const parX = Math.max(-10, Math.min(10, -Math.sin(cam.yaw - REF.yaw) * 260 * 0.25));  // kept small: the column edge stays at x 96
  const parY = Math.sin(cam.roll) * 60;
  $('text').style.transform = `translate(${parX.toFixed(2)}px, ${parY.toFixed(2)}px)`;

  // keep-out rectangles from the laid-out glyph boxes (+ the logo, always)
  const rects = [], glyphRects = [];
  const lr = $('logo').getBoundingClientRect();
  rects.push({x0: 96, x1: 209, y0: 222, y1: 226 + 0.385 * 70, v: 1});
  const blockOf = {title: 'title', fig: 'fig', lab: 'lab', sup: 'sup', src: 'src', compute: 'compute', final: 'final'};
  for (const k in blockOf) {
    if (!(vis[k] > 0)) continue;
    for (const s of $(blockOf[k]).querySelectorAll('.ink')) {
      if (s.parentElement && s.parentElement.classList.contains('ink')) continue;
      const b = s.getBoundingClientRect();
      if (b.width === 0) continue;
      // shrink line boxes to the ink band (Inter: ascender ≈ 0.97em, cap ≈ 0.73em)
      rects.push({x0: b.left, x1: b.right, y0: b.top, y1: b.bottom, v: Math.min(1, vis[k] * 3)});
      if (vis[k] > 0.5) glyphRects.push({x0: b.left, x1: b.right, y0: b.top + b.height * 0.12, y1: b.bottom - b.height * 0.12});
    }
  }

  // ---------------- particles
  for (let i = 0; i < paths.length; i++) paths[i] = new Path2D();
  const a = [0, 0, 0], b = [0, 0, 0];
  let inGlyph = 0, drawn = 0;
  const cloudDim = 0.42;
  for (let p = 0; p < N; p++) {
    particleAt(p, t, wt);
    projectWith(cam, POS[0], POS[1], POS[2], a);
    if (a[2] < 0.9) continue;
    if (a[0] < -40 || a[0] > W + 40 || a[1] < -40 || a[1] > H + 40) continue;
    const arrive = _arrive, landAge = _landAge, align = _align;
    particleAt(p, t - SHUTTER * speed, wtPrev);
    projectWith(camPrev, POS[0], POS[1], POS[2], b);
    const z = a[2];
    // depth fades (spec §5): near 0→1 over 0.9–3, far 1→0.25 over 14–34
    const dFade = smooth(seg(z, 0.9, 3.0)) * lerp(1, 0.4, smooth(seg(z, 16, 38)));
    const kind = P.kind[p];
    // settled alpha by role and phase
    let base;
    if (kind === 0) base = 1.0;
    else base = lerp(0.2, 0.75, align);   // edge material: a faint halo at its node, then a readable line
    let phaseA = lerp(cloudDim * (kind ? 0.6 : 1), base, smooth(arrive));
    // landing flash: +90 % alpha, ×1.6 size, decaying over 0.35 s
    let flash = 0;
    if (landAge >= 0 && landAge < 0.35) flash = 1 - landAge / 0.35;
    let alpha = (kind === 0 ? 0.6 + 0.4 * P.bright[p] : 0.5 + 0.5 * P.bright[p]) * dFade * phaseA * (1 + 0.9 * flash);
    const ko = keepOut(rects, a[0], a[1]);
    alpha *= ko;
    if (alpha < 0.02) continue;
    let size = Math.min(4.2, Math.max(0.9, 26 / z)) * (kind === 0 ? 2.0 : lerp(0.8, 0.9, align)) * (1 + 0.6 * flash);
    const ai = nearestIdx(A_LEVELS, Math.min(1, alpha)), si = nearestIdx(S_LEVELS, size);
    const path = paths[ai * S_LEVELS.length + si];
    let dx = a[0] - b[0], dy = a[1] - b[1];
    if (dx * dx + dy * dy < 0.04) { dx = 0.1; dy = 0; }
    path.moveTo(a[0] - dx, a[1] - dy); path.lineTo(a[0], a[1]);
    drawn++;
    for (const g of glyphRects) if (alpha > 0.03 && a[0] > g.x0 && a[0] < g.x1 && a[1] > g.y0 && a[1] < g.y1) { inGlyph++; break; }
  }
  stats.t = t; stats.drawn = drawn; stats.inGlyph = inGlyph; stats.particles = N;

  // particle layer (additive), then bloom (quarter res, 6 px blur, screen 0.75)
  lctx.setTransform(1, 0, 0, 1, 0, 0);
  lctx.globalCompositeOperation = 'source-over'; lctx.globalAlpha = 1;
  lctx.clearRect(0, 0, W, H);
  lctx.globalCompositeOperation = 'lighter';
  lctx.lineCap = 'round';
  for (let ai = 0; ai < A_LEVELS.length; ai++)
    for (let si = 0; si < S_LEVELS.length; si++) {
      lctx.globalAlpha = A_LEVELS[ai];
      lctx.lineWidth = S_LEVELS[si];
      lctx.strokeStyle = '#ffffff';
      lctx.stroke(paths[ai * S_LEVELS.length + si]);
    }
  bctx.globalCompositeOperation = 'copy'; bctx.filter = 'blur(6px)';
  bctx.drawImage(layer, 0, 0, W / 4, H / 4);
  bctx.filter = 'none';

  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  // atmosphere: Ice Blue radial lift at the horizon, 0.075 → 0.11
  const atm = (0.075 + 0.035 * smooth(seg(t, 14, 17))) * smooth(seg(t, 0, 2));
  const g = ctx.createRadialGradient(540, 1240, 0, 540, 1240, 900);
  g.addColorStop(0, `rgba(${ICE},${atm})`); g.addColorStop(0.45, `rgba(${ICE},${atm / 3})`); g.addColorStop(1, 'rgba(170,188,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(layer, 0, 0);
  ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = 0.75;
  ctx.drawImage(bloom, 0, 0, W, H);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  // grain (tile chosen by frame index)
  const fi = Math.round(t * FPS);
  gctx.fillStyle = gctx.createPattern(grainTiles[fi % 4], 'repeat');
  gctx.fillRect(0, 0, W, H);
  return stats;
};
window.__stats = stats;

// ------------------------------------------------------------------ ready: local Inter must load or the render fails
window.sceneReady = (async () => {
  const want = [400, 600, 700, 800];
  await Promise.all(want.map(w => document.fonts.load(`${w} 40px "Inter"`, '1GW Abu Dhabi')));
  await document.fonts.ready;
  const faces = [...document.fonts].filter(f => f.family.replace(/"/g, '') === 'Inter');
  if (!faces.length || faces.some(f => f.status !== 'loaded')) throw new Error('Inter failed to load');
  for (const w of want) if (!document.fonts.check(`${w} 40px "Inter"`)) throw new Error('Inter weight ' + w + ' not available');
  const logo = $('logo');
  if (!logo.complete || logo.naturalWidth === 0) await new Promise((res, rej) => { logo.onload = res; logo.onerror = () => rej(new Error('logo failed')); });
  renderAt(0);
  return {particles: N, nodes: NN, edges: edges.length};
})();
// preview: ?t=12.3 renders a single time; otherwise loop in real time
if (!/render=1/.test(location.search)) {
  window.sceneReady.then(() => {
    const m = location.search.match(/t=([\d.]+)/);
    if (m) { renderAt(parseFloat(m[1])); return; }
    const start = performance.now();
    const loop = () => { renderAt(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); };
    loop();
  });
}
</script>
